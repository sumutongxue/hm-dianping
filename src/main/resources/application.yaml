server:
  port: 8081
spring:
  profiles:
    active: local # 激活本地配置（application-local.yaml，已被gitignore，不入库）
  application:
    name: dainping
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/dainping?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
  redis:
    host: 192.168.64.130
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug